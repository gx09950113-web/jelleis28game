<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">28 GAME LAB Sound Off Icon</title>
  <desc id="desc">Gold speaker with electric blue mute symbol, transparent background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="28%" stop-color="#FFD86A"/>
      <stop offset="62%" stop-color="#D99A22"/>
      <stop offset="100%" stop-color="#8F5A10"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DE2FF"/>
      <stop offset="52%" stop-color="#2184FF"/>
      <stop offset="100%" stop-color="#0B3EAA"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- same speaker body as sound-on -->
  <path
    d="M9 26h10l13-11c1.8-1.5 4.5-.2 4.5 2.1v29.8c0 2.3-2.7 3.6-4.5 2.1L19 38H9c-1.7 0-3-1.3-3-3v-6c0-1.7 1.3-3 3-3Z"
    fill="#071A3A"
    stroke="url(#gold)"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- inner speaker accent -->
  <path
    d="M19 27v10"
    fill="none"
    stroke="url(#blue)"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".85"
  />

  <!-- mute X glow -->
  <path
    d="M44 24 57 40M57 24 44 40"
    fill="none"
    stroke="url(#blue)"
    stroke-width="7"
    stroke-linecap="round"
    opacity=".3"
    filter="url(#softGlow)"
  />

  <!-- mute X -->
  <path
    d="M44 24 57 40M57 24 44 40"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- blue center accent -->
  <circle cx="50.5" cy="32" r="2" fill="url(#blue)" filter="url(#softGlow)"/>
</svg>
