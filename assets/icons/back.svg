<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">28 GAME LAB Back Icon</title>
  <desc id="desc">Gold back arrow with electric blue accent, transparent background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="28%" stop-color="#FFD86A"/>
      <stop offset="62%" stop-color="#D99A22"/>
      <stop offset="100%" stop-color="#8F5A10"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DE2FF"/>
      <stop offset="52%" stop-color="#2184FF"/>
      <stop offset="100%" stop-color="#0B3EAA"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- blue accent glow -->
  <path
    d="M27 15 10 32l17 17M12 32h27c9 0 15 5 15 14"
    fill="none"
    stroke="url(#blue)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".34"
    filter="url(#softGlow)"
  />

  <!-- main back arrow -->
  <path
    d="M27 15 10 32l17 17"
    fill="none"
    stroke="url(#gold)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- return tail -->
  <path
    d="M12 32h27c9 0 15 5 15 14"
    fill="none"
    stroke="url(#gold)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- blue tip accent -->
  <circle cx="10" cy="32" r="2.3" fill="url(#blue)" filter="url(#softGlow)"/>
</svg>
