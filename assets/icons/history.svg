<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">28 GAME LAB History Icon</title>
  <desc id="desc">Gold history clock with electric blue hands and rewind arrow, transparent background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="28%" stop-color="#FFD86A"/>
      <stop offset="62%" stop-color="#D99A22"/>
      <stop offset="100%" stop-color="#8F5A10"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DE2FF"/>
      <stop offset="52%" stop-color="#2184FF"/>
      <stop offset="100%" stop-color="#0B3EAA"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- subtle blue clock glow -->
  <circle
    cx="34" cy="33" r="21"
    fill="none"
    stroke="url(#blue)"
    stroke-width="6"
    opacity=".32"
    filter="url(#softGlow)"
  />

  <!-- clock -->
  <path
    d="M17 20.5A21 21 0 1 1 13.5 38"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- rewind/history arrow -->
  <path
    d="M8.5 17.5v13h13"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <path
    d="M9.5 29.5A26 26 0 0 1 17 19"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- clock hands -->
  <path
    d="M34 21.5V33l9 6"
    fill="none"
    stroke="url(#blue)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- center jewel -->
  <circle cx="34" cy="33" r="2.5" fill="#FFD86A"/>
</svg>
