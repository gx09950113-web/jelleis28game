<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">28 GAME LAB Daily Login Icon</title>
  <desc id="desc">Gold calendar with electric blue check mark, transparent background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="28%" stop-color="#FFD86A"/>
      <stop offset="62%" stop-color="#D99A22"/>
      <stop offset="100%" stop-color="#8F5A10"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DE2FF"/>
      <stop offset="52%" stop-color="#2184FF"/>
      <stop offset="100%" stop-color="#0B3EAA"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- subtle blue glow behind calendar -->
  <rect
    x="10" y="14" width="44" height="41" rx="7"
    fill="none"
    stroke="url(#blue)"
    stroke-width="6"
    opacity=".35"
    filter="url(#softGlow)"
  />

  <!-- calendar body -->
  <rect
    x="10" y="14" width="44" height="41" rx="7"
    fill="#071A3A"
    stroke="url(#gold)"
    stroke-width="4.5"
  />

  <!-- binding rings -->
  <path
    d="M21 9v11M43 9v11"
    fill="none"
    stroke="url(#gold)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- header divider -->
  <path
    d="M12.5 26h39"
    fill="none"
    stroke="url(#gold)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- daily-login check -->
  <path
    d="M21.5 39 28.5 46 43 32"
    fill="none"
    stroke="url(#blue)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- small gold confirmation jewel -->
  <circle cx="48" cy="19.5" r="2" fill="#FFD86A"/>
</svg>
