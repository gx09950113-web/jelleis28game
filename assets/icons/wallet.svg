<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">28 GAME LAB Wallet Icon</title>
  <desc id="desc">Gold wallet icon with electric blue clasp accent, transparent background.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="28%" stop-color="#FFD86A"/>
      <stop offset="62%" stop-color="#D99A22"/>
      <stop offset="100%" stop-color="#8F5A10"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#73D7FF"/>
      <stop offset="55%" stop-color="#1B7DFF"/>
      <stop offset="100%" stop-color="#0B3EAA"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- subtle blue inner glow -->
  <path
    d="M13 22.5h35c3.3 0 6 2.7 6 6V48c0 3.3-2.7 6-6 6H15c-3.3 0-6-2.7-6-6V25.5c0-1.7.7-3.2 1.8-4.3"
    fill="none"
    stroke="url(#blue)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".42"
    filter="url(#softGlow)"
  />

  <!-- wallet body -->
  <path
    d="M14 21.5h34c3.3 0 6 2.7 6 6V48c0 3.3-2.7 6-6 6H15c-3.3 0-6-2.7-6-6V24.5c0-1.7.7-3.2 1.8-4.3"
    fill="none"
    stroke="url(#gold)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- folded money/card edge -->
  <path
    d="M13.5 22 38 12.5c2.4-.9 5.1.3 6 2.7l2.3 6.3"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- clasp -->
  <path
    d="M39 33.5h15v11H39c-3 0-5.5-2.5-5.5-5.5s2.5-5.5 5.5-5.5Z"
    fill="#071A3A"
    stroke="url(#blue)"
    stroke-width="3.5"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- clasp jewel -->
  <circle cx="41" cy="39" r="2.4" fill="url(#gold)"/>
</svg>
